<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Auto-Filler</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15171a;
      --muted: #667085;
      --line: #d0d5dd;
      --surface: #ffffff;
      --soft: #f7f8fa;
      --accent: #2563eb;
      --success: #15803d;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    body {
      width: 336px;
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      padding: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand img {
      width: 28px;
      height: 28px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .status {
      display: grid;
      justify-items: center;
      min-height: 118px;
      padding: 12px 0 20px;
      text-align: center;
    }

    .status-indicator {
      width: 42px;
      height: 42px;
      margin-bottom: 13px;
      border: 3px solid var(--line);
      border-radius: 50%;
    }

    .status-indicator.loading {
      border-color: #dbe4f3;
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    .status-indicator.success {
      position: relative;
      border-color: var(--success);
      background: #f0fdf4;
    }

    .status-indicator.success::after {
      position: absolute;
      top: 7px;
      left: 13px;
      width: 9px;
      height: 17px;
      border: solid var(--success);
      border-width: 0 3px 3px 0;
      content: "";
      transform: rotate(45deg);
    }

    .status-indicator.error {
      border-color: var(--error);
      background: #fff5f4;
    }

    .status-text {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
    }

    .status-text.success { color: var(--success); }
    .status-text.error { color: var(--error); }

    .status-detail {
      min-height: 18px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .field-status {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 16px;
      margin-top: 13px;
    }

    .field-status[hidden] {
      display: none;
    }

    .field-status-item {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #eaecf0;
      color: var(--muted);
      font-size: 11px;
    }

    .field-status-item strong {
      color: var(--ink);
      font-size: 11px;
      font-weight: 650;
    }

    form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;
      gap: 8px;
      padding-top: 18px;
      border-top: 1px solid #eaecf0;
    }

    label {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 38px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--ink);
      padding: 0 11px;
      font: inherit;
      font-size: 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      cursor: pointer;
      font-size: 19px;
      line-height: 1;
    }

    button:hover { background: var(--accent); }
    button:disabled, input:disabled { opacity: 0.55; cursor: wait; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-indicator.loading { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="assets/icon48.png" alt="">
      <h1>AI Auto-Filler</h1>
    </div>

    <section class="status" aria-live="polite" aria-atomic="true">
      <div id="statusIndicator" class="status-indicator loading" aria-hidden="true"></div>
      <p id="statusText" class="status-text loading">Working</p>
      <p id="statusDetail" class="status-detail">Reading the current form</p>
      <div id="fieldStatus" class="field-status" hidden></div>
    </section>

    <form id="instructionForm">
      <label for="instructionInput">Improve a specific field</label>
      <input id="instructionInput" type="text" placeholder="Make the project summary more concise" autocomplete="off">
      <button id="submitButton" type="submit" title="Apply instruction" aria-label="Apply instruction">&gt;</button>
    </form>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
